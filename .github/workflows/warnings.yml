# Reusable workflow: posts one-time warning comments on issues and PRs.
#
# Each rule in RULES has a pattern and a message. When a pattern matches the
# issue title, issue body or new comment, the message is posted once per
# thread. Add a rule to add a new warning.
#
# Call it from a repo with:
#
#   on:
#     issues:
#       types: [opened]
#     issue_comment:
#       types: [created]
#   jobs:
#     warn:
#       permissions:
#         issues: write
#         pull-requests: write
#       uses: EpixZone/.github/.github/workflows/warnings.yml@main

name: Warnings

on:
  workflow_call:

jobs:
  warn:
    runs-on: ubuntu-latest
    if: github.event.sender.type != 'Bot'
    concurrency:
      group: warnings-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const RULES = [
              {
                // Scam bots watch GitHub for these words and reply posing as
                // official support (EpixZone/EpixNet#535).
                id: 'scam',
                legacyMarkers: ['<!-- epix-scam-warning -->'],
                pattern: /\b(seed|mnemonic|recovery phrase|secret phrase|private key|keystore|wallet)s?\b/i,
                body: [
                  '> [!CAUTION]',
                  '> **Scam warning.** This thread mentions wallets, seed phrases or keys. Scam bots watch GitHub for these words and post fake "support" replies.',
                  '>',
                  '> - Epix maintainers will **never** ask for your seed phrase, recovery phrase or private key.',
                  '> - We will never send you to a "wallet validation", "sync" or "recovery" site, a Google Form, or ask you to message us on Telegram, WhatsApp or Discord DM.',
                  '> - Real maintainers show a **Member**, **Owner** or **Collaborator** badge on their comments here.',
                  '> - If you already shared your seed phrase, move your funds to a new wallet now.',
                  '>',
                  '> Report suspicious comments with the `...` menu, then **Report content**. Official help channels: [SUPPORT.md](https://github.com/EpixZone/.github/blob/main/SUPPORT.md).',
                ],
              },
            ];

            // Check the whole thread, so a comment on an existing thread
            // triggers even when the comment itself has no keywords.
            const issue = context.payload.issue;
            const text = [issue.title, issue.body, context.payload.comment?.body].join(' ');
            const matched = RULES.filter(r => r.pattern.test(text));
            if (matched.length === 0) return;

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issue.number, per_page: 100,
            });
            const posted = comments.map(c => c.body || '').join(' ');

            for (const rule of matched) {
              const marker = `<!-- epix-warning:${rule.id} -->`;
              const markers = [marker, ...(rule.legacyMarkers || [])];
              if (markers.some(m => posted.includes(m))) continue;
              const body = [marker, ...rule.body].join('\n');
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            }
