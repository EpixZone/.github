# Reusable workflow: posts a one-time scam warning on issues and PRs that
# mention wallets, seed phrases or private keys. Scam bots watch GitHub for
# these words and reply posing as official support.
#
# Call it from a repo with:
#
#   on:
#     issues:
#       types: [opened]
#     issue_comment:
#       types: [created]
#   jobs:
#     warn:
#       permissions:
#         issues: write
#         pull-requests: write
#       uses: EpixZone/.github/.github/workflows/scam-warning.yml@main

name: Scam warning

on:
  workflow_call:

jobs:
  warn:
    runs-on: ubuntu-latest
    if: github.event.sender.type != 'Bot'
    concurrency:
      group: scam-warning-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- epix-scam-warning -->';
            const TRIGGER = /\b(seed|mnemonic|recovery phrase|secret phrase|private key|keystore|wallet)s?\b/i;

            const issue = context.payload.issue;
            const text = [
              context.eventName === 'issues' ? issue.title : '',
              context.eventName === 'issues' ? issue.body : context.payload.comment?.body,
            ].join('\n');
            if (!TRIGGER.test(text || '')) return;

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issue.number, per_page: 100,
            });
            if (comments.some(c => (c.body || '').includes(MARKER))) return;

            const body = [
              MARKER,
              '> [!CAUTION]',
              '> **Scam warning.** This thread mentions wallets, seed phrases or keys. Scam bots watch GitHub for these words and post fake "support" replies.',
              '>',
              '> - Epix maintainers will **never** ask for your seed phrase, recovery phrase or private key.',
              '> - We will never send you to a "wallet validation", "sync" or "recovery" site, a Google Form, or ask you to message us on Telegram, WhatsApp or Discord DM.',
              '> - Real maintainers show a **Member**, **Owner** or **Collaborator** badge on their comments here.',
              '> - If you already shared your seed phrase, move your funds to a new wallet now.',
              '>',
              '> Report suspicious comments with the `...` menu, then **Report content**. Official help channels: [SUPPORT.md](https://github.com/EpixZone/.github/blob/main/SUPPORT.md).',
            ].join('\n');

            await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
